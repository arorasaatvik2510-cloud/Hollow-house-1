name: iOS Simulator Developer Beta
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build-ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build the web game
        run: npm run build
      - name: Generate and sync native iOS project
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO -derivedDataPath build
      - uses: actions/upload-artifact@v4
        with:
          name: hollow-house-ios-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
